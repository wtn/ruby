name: Ractor IO hammer

# Throwaway diagnostic workflow: builds --enable-yjit=dev with the rb_io_t /
# File-slot traps from this branch and loops TestRactor#test_concurrent_binwrite_shareable_string
# under full-suite load for hours. A trap firing is an rb_bug whose crash report
# (C backtrace, owning Ractor, fptr state) is dumped at the end.

on:
  push:
    branches:
      - ractor-io-diag
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  hammer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain
            configure: '--enable-yjit=dev'
            yjit: '1'
            hammer_env: ''
          - variant: checkmode
            configure: '--enable-yjit=dev cppflags=-DRGENGC_CHECK_MODE=1'
            yjit: '1'
            hammer_env: ''
          - variant: scribble
            configure: '--enable-yjit=dev'
            yjit: '1'
            hammer_env: 'MallocScribble=1 MallocPreScribble=1 MallocCheckHeapStart=1000 MallocCheckHeapEach=10000 MallocErrorAbort=1'
          - variant: asan
            configure: '--disable-yjit --disable-zjit cflags=-fsanitize=address\ -fno-omit-frame-pointer LDFLAGS=-fsanitize=address'
            yjit: ''
            hammer_env: 'ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:halt_on_error=1'

    runs-on: macos-26
    timeout-minutes: 355

    defaults:
      run:
        working-directory: build

    env:
      GITPULLOPTIONS: --no-tags origin ${{ github.ref }}
      RUN_OPTS: '--yjit-call-threshold=1 --yjit-verify-ctx --yjit-code-gc'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github
          persist-credentials: false

      - name: Install libraries
        uses: ./.github/actions/setup/macos

      - uses: ./.github/actions/setup/directories
        with:
          srcdir: src
          builddir: build
          makeup: true
          dummy-files: true
          fetch-depth: 10

      - name: Run configure
        run: ../src/configure -C --disable-install-doc ${{ matrix.configure }}

      - run: make

      - name: Set ENV for YJIT
        run: |
          test -n "${{ matrix.yjit }}" && echo "RUBY_YJIT_ENABLE=1" >> $GITHUB_ENV || true
          echo "RUBY_CRASH_REPORT=$(pwd)/rb_crash_%p.txt" >> $GITHUB_ENV

      - name: Build the open/close interposer
        run: clang -dynamiclib -O1 -g -o "$GITHUB_WORKSPACE/closelog.dylib" ../src/.github/ractor-io-diag/closelog.c

      - name: Hammer test_concurrent_binwrite_shareable_string under suite load
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/diag"
          RUNRUBY="./miniruby -I../src/lib -I. -I.ext/common ../src/tool/runruby.rb --extout=.ext -- $RUN_OPTS"
          start_load() {
            (RUBY_CRASH_REPORT="$(pwd)/load_crash_%p.txt" RUBY_ON_BUG="" make -s test-all TESTOPTS="-j4 -q --tty=no" RUN_OPTS="$RUN_OPTS" > load.log 2>&1 || true) &
            LOAD=$!
          }
          start_load
          end=$((SECONDS + 300 * 60))
          n=0
          failed=0
          while [ $SECONDS -lt $end ] && [ $failed -lt 5 ]; do
            n=$((n + 1))
            if ! env ${{ matrix.hammer_env }} DYLD_INSERT_LIBRARIES="$GITHUB_WORKSPACE/closelog.dylib" CLOSELOG_DIR="$GITHUB_WORKSPACE/diag" \
                 $RUNRUBY -r../src/tool/lib/_tmpdir ../src/test/runner.rb --ruby="$RUNRUBY" \
                   --excludes-dir=../src/test/.excludes --name='!/memory_leak/' -q --tty=no \
                   ruby/test_ractor.rb -n /test_concurrent_binwrite/ > hammer.log 2>&1; then
              failed=$((failed + 1))
              echo "=== hammer run $n failed (failure $failed)"
              cat hammer.log
              cp hammer.log "$GITHUB_WORKSPACE/diag/hammer-fail-$failed-run-$n.log"
              cp rb_crash_*.txt "$GITHUB_WORKSPACE/diag/" 2>/dev/null || true
              rm -f rb_crash_*.txt
            fi
            kill -0 $LOAD 2>/dev/null || start_load
          done
          echo "=== hammer runs: $n failed: $failed"
          kill $LOAD 2>/dev/null || true
          wait $LOAD 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/ruby* "$GITHUB_WORKSPACE/diag/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/lldb.*.log "$GITHUB_WORKSPACE/diag/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/diag"
          test $failed -eq 0
        timeout-minutes: 330
        env:
          RUBY_TESTOPTS: '-q --tty=no'
          PRECHECK_BUNDLED_GEMS: 'no'
          # The Ruby crash handler double-faulted on the first SIGSEGV; attach lldb
          # from outside and print every thread's backtrace before the process dies.
          RUBY_ON_BUG: >-
            sh -c 'cd ${{ github.workspace }} && [ $(ls lldb.*.log 2>/dev/null | wc -l) -lt 20 ] &&
            lldb --batch -p $0 -o "thread backtrace all" -o "register read" -o detach > lldb.$0.log 2>&1'

      - name: Dump diagnostics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          for f in "$GITHUB_WORKSPACE"/diag/*; do echo "==> $f <=="; head -c 200000 "$f"; echo; done

      - name: Upload diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: ractor-io-diag-${{ matrix.variant }}
          path: ${{ github.workspace }}/diag
          if-no-files-found: ignore
